next:
  name: keep-api-prod
  env: prod

server:
  host: 127.0.0.1
  port: 8000
  read_timeout: 60
  write_timeout: 60

mysql:
  host: mysql
  port: 3306
  user: root
  password: root
  database: keep_db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

log:
  level: info
  format: json
  output_path: stdout