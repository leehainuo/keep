global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: keep-api
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: keep-ai
    static_configs:
      - targets: ["host.docker.internal:50051"]
